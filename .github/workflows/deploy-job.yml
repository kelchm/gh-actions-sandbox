name: Deploy Job
run-name: Deploy to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: environment
        description: 'The target environment for deployment'
        default: 'dev'

jobs:
  deploy-job:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: "https://${{ inputs.environment }}.example.com"
    strategy:
      matrix:
        service: ['service-a', 'service-b', 'service-c']  # Define your services here
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Deployment
        run: |
          echo "Deploying ${{ matrix.service }} to ${{ inputs.environment }} Environment"
          sleep 30
          # Deployment steps for ${{ matrix.service }}...
          echo "done"

      - name: Smoke Tests
        run: |
          echo "Running Smoke Tests for ${{ matrix.service }} in ${{ inputs.environment }} Environment"
          sleep 10
          echo "done"
